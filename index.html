<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Klasemen Sepakbola + Gemini AI</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>

<body class="bg-slate-900 text-slate-200 antialiased selection:bg-emerald-500 selection:text-slate-900 min-h-screen">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const apiKey = ""; // Canvas runtime automatically supplies the API Key
    const DEFAULT_ADMIN_PIN = "1234";

    async function fetchWithBackoff(url, options, retries = 3, delay = 1000) {
      try {
        const res = await fetch(url, options);
        if (!res.ok && res.status === 429 && retries > 0) {
          await new Promise(r => setTimeout(r, delay));
          return fetchWithBackoff(url, options, retries - 1, delay * 2);
        }
        return res;
      } catch (err) {
        if (retries > 0) {
          await new Promise(r => setTimeout(r, delay));
          return fetchWithBackoff(url, options, retries - 1, delay * 2);
        }
        throw err;
      }
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function pcmToWav(pcm16Data, sampleRate = 24000) {
      const numChannels = 1;
      const bytesPerSample = 2;
      const blockAlign = numChannels * bytesPerSample;
      const byteRate = sampleRate * blockAlign;
      const dataSize = pcm16Data.length * bytesPerSample;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeString(v, offset, str) {
        for (let i = 0; i < str.length; i++) {
          v.setUint8(offset + i, str.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcm16Data.length; i++, offset += 2) {
        view.setInt16(offset, pcm16Data[i], true);
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    const defaultClubs = {
      A: [{ id: 'A1', name: 'Persib' }, { id: 'A2', name: 'Persija' }, { id: 'A3', name: 'Arema FC' }, { id: 'A4', name: 'Persebaya' }],
      B: [{ id: 'B1', name: 'Real Madrid' }, { id: 'B2', name: 'Barcelona' }, { id: 'B3', name: 'Atletico' }, { id: 'B4', name: 'Sevilla' }],
      C: [{ id: 'C1', name: 'Man City' }, { id: 'C2', name: 'Arsenal' }, { id: 'C3', name: 'Liverpool' }, { id: 'C4', name: 'Chelsea' }],
      D: [{ id: 'D1', name: 'Bayern Munich' }, { id: 'D2', name: 'Dortmund' }, { id: 'D3', name: 'Leverkusen' }, { id: 'D4', name: 'RB Leipzig' }]
    };

    const generateMatches = (teams) => [
      { id: 1, home: teams[0].id, away: teams[1].id, homeScore: '', awayScore: '', homeCards: '', awayCards: '', status: 'On Game' },
      { id: 2, home: teams[2].id, away: teams[3].id, homeScore: '', awayScore: '', homeCards: '', awayCards: '', status: 'On Game' },
      { id: 3, home: teams[0].id, away: teams[2].id, homeScore: '', awayScore: '', homeCards: '', awayCards: '', status: 'On Game' },
      { id: 4, home: teams[1].id, away: teams[3].id, homeScore: '', awayScore: '', homeCards: '', awayCards: '', status: 'On Game' },
      { id: 5, home: teams[0].id, away: teams[3].id, homeScore: '', awayScore: '', homeCards: '', awayCards: '', status: 'On Game' },
      { id: 6, home: teams[1].id, away: teams[2].id, homeScore: '', awayScore: '', homeCards: '', awayCards: '', status: 'On Game' },
    ];

    const initialMatches = {
      A: generateMatches(defaultClubs.A),
      B: generateMatches(defaultClubs.B),
      C: generateMatches(defaultClubs.C),
      D: generateMatches(defaultClubs.D),
    };

    const initialKnockout = {
      qf: [
        { id: 'qf1', title: 'Perempat Final 1', home: '', away: '', homeScore: '', awayScore: '' },
        { id: 'qf2', title: 'Perempat Final 2', home: '', away: '', homeScore: '', awayScore: '' },
        { id: 'qf3', title: 'Perempat Final 3', home: '', away: '', homeScore: '', awayScore: '' },
        { id: 'qf4', title: 'Perempat Final 4', home: '', away: '', homeScore: '', awayScore: '' },
      ],
      sf: [
        { id: 'sf1', title: 'Semifinal 1', home: '', away: '', homeScore: '', awayScore: '' },
        { id: 'sf2', title: 'Semifinal 2', home: '', away: '', homeScore: '', awayScore: '' },
      ],
      final: { id: 'final', title: 'Final Utama', home: '', away: '', homeScore: '', awayScore: '' }
    };

    function App() {
      const [isAdmin, setIsAdmin] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [isPinModalOpen, setIsPinModalOpen] = useState(false);

      const [tournamentName, setTournamentName] = useState(() => {
        return localStorage.getItem('soccer_tournament_name') || 'Turnamen Sepakbola Utama';
      });

      const [clubs, setClubs] = useState(() => {
        const saved = localStorage.getItem('soccer_clubs');
        return saved ? JSON.parse(saved) : defaultClubs;
      });

      const [adminPin, setAdminPin] = useState(() => {
        return localStorage.getItem('soccer_admin_pin') || DEFAULT_ADMIN_PIN;
      });

      const [matches, setMatches] = useState(() => {
        const saved = localStorage.getItem('soccer_matches');
        return saved ? JSON.parse(saved) : initialMatches;
      });

      const [topScorers, setTopScorers] = useState(() => {
        const saved = localStorage.getItem('soccer_top_scorers');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: 'David da Silva', team: 'Persib', goals: 5 },
          { id: 2, name: 'Vinicius Jr', team: 'Real Madrid', goals: 4 },
        ];
      });

      const [knockout, setKnockout] = useState(() => {
        const saved = localStorage.getItem('soccer_knockout');
        return saved ? JSON.parse(saved) : initialKnockout;
      });

      const [activeTab, setActiveTab] = useState('group');
      const [toastMsg, setToastMsg] = useState(null);

      const [standings, setStandings] = useState({});
      const [newScorer, setNewScorer] = useState({ name: '', team: '', goals: '' });

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [tempTournamentName, setTempTournamentName] = useState(tournamentName);
      const [tempClubs, setTempClubs] = useState(clubs);
      const [newPinInput, setNewPinInput] = useState('');

      const [isAiModalOpen, setIsAiModalOpen] = useState(false);
      const [aiActiveTab, setAiActiveTab] = useState('news');
      const [aiNewsText, setAiNewsText] = useState('');
      const [isGeneratingNews, setIsGeneratingNews] = useState(false);
      const [isGeneratingAudio, setIsGeneratingAudio] = useState(false);
      const [audioUrl, setAudioUrl] = useState(null);
      const [posterUrl, setPosterUrl] = useState(null);
      const [isGeneratingPoster, setIsGeneratingPoster] = useState(false);

      const [chatMessages, setChatMessages] = useState([
        { role: 'model', text: 'Halo! Saya Asisten Taktis AI. Tanyakan skenario kelolosan tim, poin fair play (kartu), statistik, atau prediksi pertandingan!' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [isChatLoading, setIsChatLoading] = useState(false);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      useEffect(() => {
        localStorage.setItem('soccer_tournament_name', tournamentName);
        localStorage.setItem('soccer_clubs', JSON.stringify(clubs));
        localStorage.setItem('soccer_matches', JSON.stringify(matches));
        localStorage.setItem('soccer_top_scorers', JSON.stringify(topScorers));
        localStorage.setItem('soccer_knockout', JSON.stringify(knockout));
      }, [tournamentName, clubs, matches, topScorers, knockout]);

      const handleLoginAdmin = () => {
        if (pinInput === adminPin) {
          setIsAdmin(true);
          setIsPinModalOpen(false);
          setPinInput('');
          showToast("🔓 Berhasil masuk ke Mode Admin (Panitia)!");
        } else {
          showToast("❌ PIN Salah! Silakan coba lagi.");
        }
      };

      const handleSwitchToViewer = () => {
        setIsAdmin(false);
        showToast("👁️ Berada dalam Mode Penonton (Read-Only)");
      };

      useEffect(() => {
        const newStandings = {};

        Object.keys(clubs).forEach(groupName => {
          let groupStandings = clubs[groupName].map(club => ({
            id: club.id, 
            name: club.name,
            played: 0, won: 0, drawn: 0, lost: 0,
            gf: 0, ga: 0, gd: 0, points: 0, cards: 0
          }));

          matches[groupName]?.forEach(match => {
            if (match.homeScore !== '' && match.awayScore !== '') {
              const hs = parseInt(match.homeScore, 10);
              const as = parseInt(match.awayScore, 10);
              const hc = parseInt(match.homeCards || '0', 10);
              const ac = parseInt(match.awayCards || '0', 10);
              
              const homeTeam = groupStandings.find(t => t.id === match.home);
              const awayTeam = groupStandings.find(t => t.id === match.away);

              if (homeTeam && awayTeam) {
                homeTeam.played += 1;
                awayTeam.played += 1;
                homeTeam.gf += hs;
                homeTeam.ga += as;
                awayTeam.gf += as;
                awayTeam.ga += hs;

                homeTeam.cards += isNaN(hc) ? 0 : hc;
                awayTeam.cards += isNaN(ac) ? 0 : ac;

                if (hs > as) {
                  homeTeam.won += 1; homeTeam.points += 3; awayTeam.lost += 1;
                } else if (hs < as) {
                  awayTeam.won += 1; awayTeam.points += 3; homeTeam.lost += 1;
                } else {
                  homeTeam.drawn += 1; homeTeam.points += 1;
                  awayTeam.drawn += 1; awayTeam.points += 1;
                }
              }
            }
          });

          groupStandings.forEach(team => team.gd = team.gf - team.ga);
          groupStandings.sort((a, b) => {
            if (b.points !== a.points) return b.points - a.points;
            if (b.gd !== a.gd) return b.gd - a.gd;
            if (b.gf !== a.gf) return b.gf - a.gf;
            return a.cards - b.cards;
          });

          newStandings[groupName] = groupStandings;
        });

        setStandings(newStandings);
      }, [matches, clubs]);

      useEffect(() => {
        if (!standings.A || !standings.B || !standings.C || !standings.D) return;

        const a1 = standings.A[0]?.name || 'Juara Grup A';
        const a2 = standings.A[1]?.name || 'Runner-up A';
        const b1 = standings.B[0]?.name || 'Juara Grup B';
        const b2 = standings.B[1]?.name || 'Runner-up B';
        const c1 = standings.C[0]?.name || 'Juara Grup C';
        const c2 = standings.C[1]?.name || 'Runner-up C';
        const d1 = standings.D[0]?.name || 'Juara Grup D';
        const d2 = standings.D[1]?.name || 'Runner-up D';

        setKnockout(prev => ({
          ...prev,
          qf: [
            { ...prev.qf[0], home: a1, away: b2 },
            { ...prev.qf[1], home: c1, away: d2 },
            { ...prev.qf[2], home: b1, away: a2 },
            { ...prev.qf[3], home: d1, away: c2 },
          ]
        }));
      }, [standings]);

      const updateKnockoutWinner = (stage, index, hScore, aScore) => {
        const hs = parseInt(hScore, 10);
        const as = parseInt(aScore, 10);
        if (isNaN(hs) || isNaN(as)) return;

        if (stage === 'qf') {
          const match = knockout.qf[index];
          const winner = hs > as ? match.home : hs < as ? match.away : `${match.home} (Pen)`;
          
          setKnockout(prev => {
            const newSf = [...prev.sf];
            if (index === 0) newSf[0] = { ...newSf[0], home: winner };
            if (index === 1) newSf[0] = { ...newSf[0], away: winner };
            if (index === 2) newSf[1] = { ...newSf[1], home: winner };
            if (index === 3) newSf[1] = { ...newSf[1], away: winner };
            return { ...prev, sf: newSf };
          });
        } else if (stage === 'sf') {
          const match = knockout.sf[index];
          const winner = hs > as ? match.home : hs < as ? match.away : `${match.home} (Pen)`;

          setKnockout(prev => {
            const newFinal = { ...prev.final };
            if (index === 0) newFinal.home = winner;
            if (index === 1) newFinal.away = winner;
            return { ...prev, final: newFinal };
          });
        }
      };

      const handleScoreChange = (group, matchId, type, value) => {
        if (!isAdmin) return;
        if (type !== 'status' && value !== '' && (!/^\d+$/.test(value) || parseInt(value, 10) < 0 || parseInt(value, 10) > 99)) return;
        setMatches(prev => ({
          ...prev,
          [group]: prev[group].map(match => match.id === matchId ? { ...match, [type]: value } : match)
        }));
      };

      const handleKnockoutScoreChange = (stage, index, type, value) => {
        if (!isAdmin) return;
        if (value !== '' && (!/^\d+$/.test(value) || parseInt(value, 10) < 0 || parseInt(value, 10) > 99)) return;

        if (stage === 'qf' || stage === 'sf') {
          setKnockout(prev => {
            const list = [...prev[stage]];
            list[index] = { ...list[index], [type]: value };
            return { ...prev, [stage]: list };
          });
          
          const target = stage === 'qf' ? knockout.qf[index] : knockout.sf[index];
          const hVal = type === 'homeScore' ? value : target.homeScore;
          const aVal = type === 'awayScore' ? value : target.awayScore;
          updateKnockoutWinner(stage, index, hVal, aVal);
        } else if (stage === 'final') {
          setKnockout(prev => ({
            ...prev,
            final: { ...prev.final, [type]: value }
          }));
        }
      };

      const handleSimulateMatches = () => {
        if (!isAdmin) return;
        const simulated = {};
        Object.keys(matches).forEach(group => {
          simulated[group] = matches[group].map(m => ({
            ...m,
            homeScore: Math.floor(Math.random() * 4).toString(),
            awayScore: Math.floor(Math.random() * 4).toString(),
            homeCards: Math.floor(Math.random() * 3).toString(),
            awayCards: Math.floor(Math.random() * 3).toString(),
            status: Math.random() > 0.5 ? 'FULL TIME' : 'On Game'
          }));
        });
        setMatches(simulated);
        showToast("🎲 Semua skor, status & kartu kuning berhasil disimulasikan!");
      };

      const handleResetScores = () => {
        if (!isAdmin) return;
        const resetM = {};
        Object.keys(matches).forEach(group => {
          resetM[group] = matches[group].map(m => ({ ...m, homeScore: '', awayScore: '', homeCards: '', awayCards: '', status: 'On Game' }));
        });
        setMatches(resetM);
        setKnockout(initialKnockout);
        showToast("🧹 Seluruh skor & kartu berhasil direset!");
      };

      const handleAddScorer = () => {
        if (!isAdmin) return;
        if (!newScorer.name || !newScorer.goals) return;
        const newEntry = {
          id: Date.now(),
          name: newScorer.name,
          team: newScorer.team || '-',
          goals: parseInt(newScorer.goals, 10)
        };
        setTopScorers(prev => [...prev, newEntry].sort((a, b) => b.goals - a.goals));
        setNewScorer({ name: '', team: '', goals: '' });
        showToast("⚽ Pencetak gol berhasil ditambahkan!");
      };

      const handleUpdateGoals = (id, delta) => {
        if (!isAdmin) return;
        setTopScorers(prev => {
          const updated = prev.map(s => s.id === id ? { ...s, goals: Math.max(0, s.goals + delta) } : s);
          return updated.sort((a, b) => b.goals - a.goals);
        });
      };

      const handleDeleteScorer = (id) => {
        if (!isAdmin) return;
        setTopScorers(prev => prev.filter(s => s.id !== id));
      };

      const handleOpenSettings = () => {
        if (!isAdmin) {
          setIsPinModalOpen(true);
          return;
        }
        setTempTournamentName(tournamentName);
        setTempClubs(JSON.parse(JSON.stringify(clubs)));
        setNewPinInput('');
        setIsSettingsOpen(true);
      };

      const handleSaveSettings = () => {
        setTournamentName(tempTournamentName);
        setClubs(tempClubs);
        if (newPinInput.trim().length >= 4) {
          setAdminPin(newPinInput.trim());
          localStorage.setItem('soccer_admin_pin', newPinInput.trim());
        }
        setIsSettingsOpen(false);
        showToast("⚙️ Pengaturan turnamen & PIN berhasil disimpan!");
      };

      const handleResetAllData = () => {
        if (window.confirm("Apakah Anda yakin ingin mengembalikan semua nama tim dan skor ke kondisi awal?")) {
          setTournamentName('Turnamen Sepakbola Utama');
          setClubs(defaultClubs);
          setMatches(initialMatches);
          setKnockout(initialKnockout);
          setAdminPin(DEFAULT_ADMIN_PIN);
          localStorage.clear();
          setIsSettingsOpen(false);
          showToast("🔄 Data berhasil dikembalikan ke awal!");
        }
      };

      const handleTempClubChange = (group, clubId, newName) => {
        setTempClubs(prev => ({
          ...prev,
          [group]: prev[group].map(c => c.id === clubId ? { ...c, name: newName } : c)
        }));
      };

      const getTournamentContext = () => {
        let summary = `Nama Turnamen: ${tournamentName}\n\nKLASEMEN SAAT INI (Poin, Selisih Gol, Fair Play/Kartu):\n`;
        Object.keys(standings).forEach(group => {
          summary += `--- GRUP ${group} ---\n`;
          standings[group]?.forEach((team, idx) => {
            summary += `${idx + 1}. ${team.name} | Main: ${team.played}, Poin: ${team.points}, SG: ${team.gd} (GM: ${team.gf}, GK: ${team.ga}), Kartu Kuning: ${team.cards}\n`;
          });
        });

        if (topScorers.length > 0) {
          summary += `\nTOP SKOR SEMENTARA:\n`;
          topScorers.slice(0, 5).forEach((scorer, i) => {
            summary += `${i + 1}. ${scorer.name} (${scorer.team}) - ${scorer.goals} Gol\n`;
          });
        }
        return summary;
      };

      const handleGenerateAiNews = async () => {
        setIsGeneratingNews(true);
        setAiNewsText('');
        setAudioUrl(null);

        const prompt = `Act as an energetic sports broadcaster and football journalist in Indonesia. 
Write a captivating, thrilling news report and tactical analysis based on these live tournament standings, scores, and fair play card records:

${getTournamentContext()}

Instructions:
- Write in Indonesian language ("Bahasa Indonesia").
- Include a bold catchy headline.
- Highlight group leaders, standout performances, fair play record, and intense qualification battles.
- Mention top scorers if relevant.
- Keep the style engaging, professional, and full of football enthusiasm!`;

        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const response = await fetchWithBackoff(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          });

          const data = await response.json();
          const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Gagal menghasilkan berita turnamen.";
          setAiNewsText(generatedText);
        } catch (err) {
          console.error(err);
          setAiNewsText("Terjadi kesalahan koneksi saat memanggil Gemini API.");
        } finally {
          setIsGeneratingNews(false);
        }
      };

      const handleGenerateAudioCommentary = async () => {
        if (!aiNewsText) return;
        setIsGeneratingAudio(true);

        const textToSpeech = `Dengar siaran berita turnamen berikut: ${aiNewsText.replace(/[*#]/g, '').slice(0, 400)}`;

        const payload = {
          contents: [{
            parts: [{ text: `Bicaralah dengan nada semangat seorang komentator bola radio: ${textToSpeech}` }]
          }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: "Fenrir" }
              }
            }
          }
        };

        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
          const response = await fetchWithBackoff(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          const candidatePart = result?.candidates?.[0]?.content?.parts?.[0];
          const audioBase64 = candidatePart?.inlineData?.data;
          const mimeType = candidatePart?.inlineData?.mimeType || "audio/L16;rate=24000";

          if (audioBase64) {
            let sampleRate = 24000;
            const rateMatch = mimeType.match(/rate=(\d+)/);
            if (rateMatch) sampleRate = parseInt(rateMatch[1], 10);

            const pcmBuffer = base64ToArrayBuffer(audioBase64);
            const pcm16 = new Int16Array(pcmBuffer);
            const wavBlob = pcmToWav(pcm16, sampleRate);
            const url = URL.createObjectURL(wavBlob);
            setAudioUrl(url);
          } else {
            showToast("⚠️ Gagal memuat audio siaran.");
          }
        } catch (err) {
          console.error(err);
          showToast("⚠️ Gagal menghubungi layanan Gemini TTS.");
        } finally {
          setIsGeneratingAudio(false);
        }
      };

      const handleGeneratePoster = async () => {
        setIsGeneratingPoster(true);

        const prompt = `A cinematic, ultra-hd sports poster and banner design for a football tournament named "${tournamentName}". Modern stadium, glowing floodlights, golden trophy, intense atmosphere, vector sports graphics, highly detailed 8k render.`;

        const payload = {
          contents: [{
            parts: [{ text: prompt }]
          }],
          generationConfig: {
            responseModalities: ['IMAGE'],
            imageConfig: { aspectRatio: "16:9" }
          }
        };

        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;
          const response = await fetchWithBackoff(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

${getTournamentContext()}

Catatan: Jika ada poin & SG sama, tim dengan kartu kuning lebih sedikit berhak di atas (Fair Play).
Jawablah secara ramah, informatif, dan cerdas seputar skenario poin, analisa tim, atau strategi!`;

              </div>
            )}

            {/* TAB 3: TOP SCORERS */}
            {activeTab === 'scorers' && (
              <div className="bg-slate-800/90 rounded-2xl shadow-xl border border-slate-700/80 overflow-hidden backdrop-blur">
                <div className="bg-slate-950/60 p-5 border-b border-slate-700 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                  <div>
                    <h2 className="text-2xl font-bold text-amber-400 flex items-center gap-2">
                      <span>🏆</span> Klasemen Top Skor (Pencetak Gol)
                    </h2>
                    <p className="text-slate-400 text-xs md:text-sm mt-1">
                      {isAdmin ? 'Tambah atau perbarui jumlah gol pemain.' : 'Daftar pencetak gol terbanyak saat ini.'}
                    </p>
                  </div>
                  
                  {isAdmin && (
                    <div className="flex flex-wrap items-center gap-2 bg-slate-900 p-2 rounded-xl border border-slate-700/80 w-full lg:w-auto">
                      <input 
                        type="text" placeholder="Nama Pemain" 
                        className="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-amber-500 flex-1 lg:w-36"
                        value={newScorer.name} onChange={(e) => setNewScorer({...newScorer, name: e.target.value})}
                      />
                      <input 
                        type="text" placeholder="Klub" 
                        className="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-amber-500 flex-1 lg:w-28"
                        value={newScorer.team} onChange={(e) => setNewScorer({...newScorer, team: e.target.value})}
                      />
                      <input 
                        type="number" placeholder="Gol" min="1"
                        className="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-amber-500 w-20 text-center"
                        value={newScorer.goals} onChange={(e) => setNewScorer({...newScorer, goals: e.target.value})}
                      />
                      <button 
                        onClick={handleAddScorer}
                        className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition-all active:scale-95 shadow-md"
                      >
                        + Tambah
                      </button>
                    </div>
                  )}
                </div>

                <div className="p-0">
                  {topScorers.length > 0 ? (
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm text-left">
                        <thead className="text-xs uppercase bg-slate-900/80 text-slate-400 border-b border-slate-700/50">
                          <tr>
                            <th className="px-6 py-3.5 w-16">Rank</th>
                            <th className="px-6 py-3.5">Nama Pemain</th>
                            <th className="px-6 py-3.5">Klub</th>
                            <th className="px-6 py-3.5 text-center text-amber-400 font-bold">Total Gol</th>
                            {isAdmin && <th className="px-6 py-3.5 text-center">Aksi</th>}
                          </tr>
                        </thead>
                        <tbody>
                          {topScorers.map((scorer, index) => (
                            <tr key={scorer.id} className="border-b border-slate-700/40 hover:bg-slate-700/30 transition-colors">
                              <td className="px-6 py-4 font-medium">
                                <span className={`inline-flex items-center justify-center w-8 h-8 rounded-full font-black text-sm shadow-md ${
                                  index === 0 ? 'bg-amber-500 text-slate-950' : 
                                  index === 1 ? 'bg-slate-300 text-slate-900' : 
                                  index === 2 ? 'bg-amber-700 text-white' : 'bg-slate-700 text-slate-300'
                                }`}>
                                  {index + 1}
                                </span>
                              </td>
                              <td className="px-6 py-4 font-bold text-white text-base">{scorer.name}</td>
                              <td className="px-6 py-4 text-slate-300">{scorer.team}</td>
                              <td className="px-6 py-4 text-center">
                                {isAdmin ? (
                                  <div className="flex items-center justify-center gap-3">
                                    <button onClick={() => handleUpdateGoals(scorer.id, -1)} className="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-white font-bold active:scale-95">-</button>
                                    <span className="font-black text-amber-400 text-xl w-8 text-center">{scorer.goals}</span>
                                    <button onClick={() => handleUpdateGoals(scorer.id, 1)} className="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-white font-bold active:scale-95">+</button>
                                  </div>
                                ) : (
                                  <span className="font-black text-amber-400 text-xl">{scorer.goals}</span>
                                )}
                              </td>
                              {isAdmin && (
                                <td className="px-6 py-4 text-center">
                                  <button onClick={() => handleDeleteScorer(scorer.id)} className="text-red-400 hover:text-red-300 font-semibold hover:underline">Hapus</button>
                                </td>
                              )}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="text-center py-12 bg-slate-900/30 text-slate-400 text-sm">
                      Belum ada data Top Skor.
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>

          {/* Admin PIN Login Modal */}
          {isPinModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
              <div className="bg-slate-800 rounded-2xl border border-amber-500/40 w-full max-w-md p-6 shadow-2xl text-center space-y-4">
                <div className="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center text-2xl mx-auto border border-amber-500/30">
                  🔐
                </div>
                <h2 className="text-xl font-bold text-white">Masuk Mode Admin (Panitia)</h2>
                <p className="text-xs text-slate-400">Masukkan PIN Admin untuk mengubah skor dan pengaturan turnamen.<br/><span className="text-slate-500 text-[11px]">(PIN default: 1234)</span></p>
                
                <input 
                  type="password" 
                  placeholder="Masukkan PIN Admin"
                  className="w-full bg-slate-950 border border-slate-600 rounded-xl px-4 py-3 text-center text-white font-mono text-xl tracking-widest focus:border-amber-500 outline-none"
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleLoginAdmin()}
                />

                <div className="flex flex-col gap-2 pt-2">
                  <div className="flex gap-2">
                    <button onClick={() => setIsPinModalOpen(false)} className="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold text-xs">
                      Batal
                    </button>
                    <button onClick={handleLoginAdmin} className="flex-1 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-lg">
                      Buka Akses Admin
                    </button>
                  </div>
                  <button 
                    onClick={() => {
                      setAdminPin(DEFAULT_ADMIN_PIN);
                      localStorage.setItem('soccer_admin_pin', DEFAULT_ADMIN_PIN);
                      showToast("🔄 PIN telah direset kembali ke default: 1234");
                    }}
                    className="text-xs text-amber-400 hover:text-amber-300 underline py-1 font-semibold"
                  >
                    Lupa PIN? Reset ke Default (1234)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Settings Modal */}
          {isSettingsOpen && isAdmin && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
              <div className="bg-slate-800 rounded-2xl border border-slate-600 w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
                <div className="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-950">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2"><span>⚙️</span> Pengaturan Turnamen & Keamanan</h2>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
                </div>
                
                <div className="p-6 overflow-y-auto custom-scrollbar space-y-6">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Nama Turnamen / Kompetisi</label>
                    <input 
                      type="text" 
                      value={tempTournamentName}
                      onChange={(e) => setTempTournamentName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-600 rounded-xl px-4 py-3 text-white font-bold text-lg focus:border-blue-500 outline-none"
                    />
                  </div>

                  <div className="bg-slate-900/90 rounded-xl p-4 border border-amber-500/30 space-y-3">
                    <h3 className="font-bold text-amber-400 text-sm flex items-center gap-2">
                      <span>🔐</span> Keamanan PIN Admin Panitia
                    </h3>
                    <p className="text-xs text-slate-400">Ubah PIN Akses Panitia agar penonton umum tidak dapat mengubah skor pertandingan.</p>
                    <div className="flex flex-col sm:flex-row gap-3 items-center">
                      <div className="w-full">
                        <label className="block text-[11px] text-slate-400 mb-1">PIN Baru (Kosongkan jika tidak ingin mengubah)</label>
                        <input 
                          type="password" 
                          placeholder="Minimal 4 karakter PIN" 
                          value={newPinInput}
                          onChange={(e) => setNewPinInput(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-amber-300 font-mono tracking-widest outline-none focus:border-amber-500"
                        />
                      </div>
                    </div>
                  </div>

                  <div>
                    <div className="mb-3 text-xs font-bold text-slate-400 uppercase tracking-wider">Daftar Klub Peserta (Grup A - D)</div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      {Object.keys(tempClubs).map(groupName => (
                        <div key={groupName} className="bg-slate-900/80 rounded-xl p-4 border border-slate-700/80">
                          <h3 className="font-bold text-emerald-400 mb-3 border-b border-slate-700/80 pb-2 flex items-center justify-between">
                            <span>GRUP {groupName}</span>
                            <span className="text-xs text-slate-500">4 Tim</span>
                          </h3>
                          <div className="space-y-2">
                            {tempClubs[groupName].map((club, i) => (
                              <div key={club.id} className="flex items-center gap-2">
                                <span className="text-slate-500 font-mono text-xs w-4">{i+1}.</span>
                                <input 
                                  type="text"
                                  value={club.name}
                                  onChange={(e) => handleTempClubChange(groupName, club.id, e.target.value)}
                                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200 focus:border-emerald-500 focus:bg-slate-950 outline-none text-sm transition-colors"
                                />
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-slate-700 bg-slate-950 flex justify-between items-center">
                  <button onClick={handleResetAllData} className="px-4 py-2 rounded-xl text-red-400 hover:bg-red-500/10 font-semibold text-xs border border-red-500/30">
                    🔄 Reset Semua Data
                  </button>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setIsSettingsOpen(false)} className="px-4 py-2 rounded-xl text-slate-300 hover:bg-slate-800 font-semibold text-xs">Batal</button>
                    <button onClick={handleSaveSettings} className="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg active:scale-95 transition-all">Simpan Perubahan</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* AI Hub Modal */}
          {isAiModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
              <div className="bg-slate-800 rounded-2xl border border-purple-500/40 w-full max-w-4xl h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                
                <div className="p-4 md:p-5 border-b border-slate-700 flex justify-between items-center bg-slate-950">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-xl shadow-lg">
                      ✨
                    </div>
                    <div>
                      <h2 className="text-lg md:text-xl font-extrabold text-white">Gemini AI Hub Turnamen</h2>
                      <p className="text-xs text-purple-400">Analisis Berita, Suara Komentator, Poster AI, & Asisten Chat</p>
                    </div>
                  </div>
                  <button onClick={() => setIsAiModalOpen(false)} className="text-slate-400 hover:text-white text-2xl font-bold leading-none">&times;</button>
                </div>

                <div className="flex border-b border-slate-700 bg-slate-900/80 px-4">
                  <button 
                    onClick={() => setAiActiveTab('news')}
                    className={`px-4 py-3 text-xs md:text-sm font-bold border-b-2 transition-all flex items-center gap-2 ${
                      aiActiveTab === 'news' ? 'border-purple-500 text-purple-400 bg-purple-500/10' : 'border-transparent text-slate-400 hover:text-white'
                    }`}
                  >
                    <span>📰</span> Berita & Radio AI
                  </button>
                  <button 
                    onClick={() => setAiActiveTab('poster')}
                    className={`px-4 py-3 text-xs md:text-sm font-bold border-b-2 transition-all flex items-center gap-2 ${
                      aiActiveTab === 'poster' ? 'border-purple-500 text-purple-400 bg-purple-500/10' : 'border-transparent text-slate-400 hover:text-white'
                    }`}
                  >
                    <span>🎨</span> Poster Turnamen AI
                  </button>
                  <button 
                    onClick={() => setAiActiveTab('chat')}
                    className={`px-4 py-3 text-xs md:text-sm font-bold border-b-2 transition-all flex items-center gap-2 ${
                      aiActiveTab === 'chat' ? 'border-purple-500 text-purple-400 bg-purple-500/10' : 'border-transparent text-slate-400 hover:text-white'
                    }`}
                  >
                    <span>💬</span> Asisten Taktis AI
                  </button>
                </div>

                <div className="flex-1 p-6 overflow-y-auto custom-scrollbar bg-slate-900/50">
                  {aiActiveTab === 'news' && (
                    <div className="space-y-5">
                      <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <div>
                          <h3 className="font-bold text-white text-base">Hasilkan Laporan Berita & Klasemen Terbaru</h3>
                          <p className="text-xs text-slate-400">AI menganalisis poin, perolehan gol, catatan fair play (kartu), dan persaingan grup.</p>
                        </div>
                        <button 
                          onClick={handleGenerateAiNews}
                          disabled={isGeneratingNews}
                          className="bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition-all shadow-lg flex items-center gap-2 active:scale-95"
                        >
                          {isGeneratingNews ? <span className="animate-spin">🌀</span> : <span>⚡</span>}
                          {isGeneratingNews ? 'Menganalisis...' : 'Buat Berita AI'}
                        </button>
                      </div>

                      {aiNewsText ? (
                        <div className="bg-slate-950 p-5 rounded-2xl border border-purple-500/30 shadow-inner space-y-4">
                          <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                            <span className="text-xs uppercase font-bold text-purple-400 tracking-wider">Laporan Pers Jurnalis AI</span>
                            <button
                              onClick={handleGenerateAudioCommentary}
                              disabled={isGeneratingAudio}
                              className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2 transition-all shadow-md active:scale-95"
                            >
                              {isGeneratingAudio ? <span className="animate-spin">🌀</span> : <span>🎙️</span>}
                              {isGeneratingAudio ? 'Membuat Audio...' : 'Dengar Radio Komentator (TTS)'}
                            </button>
                          </div>

                          {audioUrl && (
                            <div className="bg-slate-900 p-3 rounded-xl border border-emerald-500/40 flex items-center gap-3">
                              <span className="text-xl">📻</span>
                              <div className="flex-1">
                                <p className="text-xs font-bold text-emerald-400">Siaran Komentator Bola Gemini TTS</p>
                                <audio src={audioUrl} controls className="w-full h-8 mt-1" />
                              </div>
                            </div>
                          )}

                          <div className="prose prose-invert max-w-none text-slate-200 text-sm whitespace-pre-wrap leading-relaxed">
                            {aiNewsText}
                          </div>
                        </div>
                      ) : (
                        <div className="text-center py-16 text-slate-500 text-sm border border-dashed border-slate-700 rounded-2xl">
                          Klik tombol di atas untuk menghasilkan laporan berita & analisis terkini.
                        </div>
                      )}
                    </div>
                  )}

                  {aiActiveTab === 'poster' && (
                    <div className="space-y-5 text-center">
                      <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row items-center justify-between gap-4 text-left">
                        <div>
                          <h3 className="font-bold text-white text-base">Buat Banner / Poster Turnamen AI</h3>
                          <p className="text-xs text-slate-400">Menggunakan model <code className="text-purple-300 bg-slate-900 px-1.5 py-0.5 rounded">gemini-3.1-flash-image</code> untuk merancang desain poster.</p>
                        </div>
                        <button 
                          onClick={handleGeneratePoster}
                          disabled={isGeneratingPoster}
                          className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition-all shadow-lg flex items-center gap-2 active:scale-95 whitespace-nowrap"
                        >
                          {isGeneratingPoster ? <span className="animate-spin">🌀</span> : <span>🎨</span>}
                          {isGeneratingPoster ? 'Merancang Poster...' : 'Hasilkan Poster'}
                        </button>
                      </div>

                      {posterUrl ? (
                        <div className="bg-slate-950 p-4 rounded-2xl border border-indigo-500/30">
                          <img src={posterUrl} alt="Generated Poster" className="w-full max-h-[420px] object-cover rounded-xl shadow-2xl" />
                          <p className="text-xs text-slate-400 mt-3">Poster berhasil dibuat dan otomatis dipasang di banner utama!</p>
                        </div>
                      ) : (
                        <div className="py-20 text-slate-500 text-sm border border-dashed border-slate-700 rounded-2xl">
                          Belum ada poster. Klik <strong className="text-indigo-400">"Hasilkan Poster"</strong> untuk membuat desain grafis AI.
                        </div>
                      )}
                    </div>
                  )}

                  {aiActiveTab === 'chat' && (
                    <div className="flex flex-col h-[520px] bg-slate-950 rounded-2xl border border-slate-700/80 overflow-hidden">
                      <div className="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar">
                        {chatMessages.map((msg, i) => (
                          <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                            <div className={`max-w-[80%] rounded-2xl px-4 py-2.5 text-sm ${
                              msg.role === 'user' 
                                ? 'bg-purple-600 text-white rounded-br-none' 
                                : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'
                            }`}>
                              <p className="whitespace-pre-wrap">{msg.text}</p>
                            </div>
                          </div>
                        ))}
                        {isChatLoading && (
                          <div className="flex justify-start">
                            <div className="bg-slate-800 text-slate-400 border border-slate-700 rounded-2xl px-4 py-2 text-xs animate-pulse">
                              Asisten AI sedang berpikir...
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
                        <input 
                          type="text"
                          placeholder="Tanyakan skenario poin, fair play, atau prediksi..."
                          className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-purple-500 outline-none"
                          value={chatInput}
                          onChange={(e) => setChatInput(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && handleSendChatMessage()}
                        />
                        <button 
                          onClick={handleSendChatMessage}
                          disabled={isChatLoading}
                          className="bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition-all shadow-md active:scale-95"
                        >
                          Kirim
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
